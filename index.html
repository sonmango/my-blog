<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Design Portfolio</title>

    <style>
        body {
            margin: 40px;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .project {
            background: #1b1b1b;
            border-radius: 12px;
            overflow: hidden;
        }

        .project img {
            width: 100%;
            display: block;
        }

        .project-info {
            padding: 18px;
        }

        .project-info p {
            margin: 0;
            color: #cccccc;
            font-size: 15px;
            line-height: 1.5;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>My 3D Design Portfolio</h1>

<div class="gallery">

    <div class="project">
        <img src="SurferBot(1.8) v1.png">
        <div class="project-info">
            <p> R&E 연구를 위해 만든 배
                각 구멍에는 배터리와 진동 모터가 들어감</p>
        </div>
    </div>

    <div class="project">
        <img src="bag.jpg">
        <div class="project-info">
            <p> 디자인대회에 출품하였던 가방 슬라이딩 걸이</p>
        </div>
    </div>

    <div class="project">
        <img src="slinky 30 1 v1.png">
        <div class="project-info">
            <p> 전람회 연구를 위해 30도의 기울기를 가진 원뿔 슬링키(스프링) 제작</p>
        </div>
    </div>

    <div class="project">
        <img src="split version 1 v2.png">
        <div class="project-info">
            <p> 사키 연구를 위해 큰 원뿔 껍질을 작은 조각으로 나눈 도안</p>
        </div>
    </div>

</div>

</body>
</html>
